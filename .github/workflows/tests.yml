name: tests
on: [push, pull_request]
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -c "from tests.test_demo import test_demo_names_the_sample_sites; test_demo_names_the_sample_sites()"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpi-reader"
version = "2.0.0"
description = "Plain-language look at network traffic. Does not decrypt anything."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["scapy>=2.5.0"]

[project.scripts]
dpi = "dpi.cli:main"

[tool.setuptools.packages.find]
include = ["dpi*"]
